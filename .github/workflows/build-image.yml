name: build-image

# Build the okdp-gitops image (the binary on Alpine, which a CI runner copies
# out or runs) and publish it to the OKDP registry on quay.io, tagged with
# the version given.

on:
  workflow_call:
    inputs:
      version:
        description: Version to tag the image with
        required: true
        type: string
    secrets:
      REGISTRY_USERNAME:
        required: true
      REGISTRY_ROBOT_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Version to tag the image with
        required: true
        type: string

permissions:
  contents: read

env:
  # The commit of OKDP/okdp-compiler the image builds with: go.mod replaces
  # github.com/okdp/okdp-compiler with ../okdp-compiler until it releases the
  # API okdp-gitops uses (after v0.6.0). A full SHA, bumped by hand (the same
  # as ci.yml's); the release replaces it, and the replace with it.
  OKDP_COMPILER_REF: 5dce9b845812073154f1262ffba8a6c008290a50
  # Likewise OKDP/cel2yaml, replaced with ../cel2yaml.
  OKDP_CEL2YAML_REF: 9ceff0ff17d7ccb415edafa88b6959726faf1765

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      # The gha build cache (cache-from/cache-to type=gha) uses the runner's
      # ACTIONS_RUNTIME_TOKEN, not GITHUB_TOKEN: no actions: write needed.
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # A clone takes a branch or a tag, not a commit: init, fetch the commit.
      - name: Fetch okdp-compiler next to the repository, at OKDP_COMPILER_REF
        run: |
          git init -q ../okdp-compiler
          git -C ../okdp-compiler remote add origin https://github.com/OKDP/okdp-compiler.git
          git -C ../okdp-compiler fetch -q --depth 1 origin "$OKDP_COMPILER_REF"
          git -C ../okdp-compiler checkout -q FETCH_HEAD
      - name: Fetch cel2yaml next to the repository, at OKDP_CEL2YAML_REF
        run: |
          git init -q ../cel2yaml
          git -C ../cel2yaml remote add origin https://github.com/OKDP/cel2yaml.git
          git -C ../cel2yaml fetch -q --depth 1 origin "$OKDP_CEL2YAML_REF"
          git -C ../cel2yaml checkout -q FETCH_HEAD
      # The version, through the environment, never in the script: SemVer
      # (a leading "v" dropped), the whole string, else the job fails, the
      # input not printed. A comma, a newline or a space would add tags
      # (docker/build-push-action splits tags on them) or an output of its
      # own.
      - id: vars
        env:
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          version="${INPUT_VERSION#v}"   # the image tag and the binary carry no leading "v"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::the version input is not MAJOR.MINOR.PATCH[-PRERELEASE] (SemVer, an optional leading v)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: quay.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_ROBOT_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          build-contexts: |
            okdp-compiler=../okdp-compiler
            cel2yaml=../cel2yaml
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: quay.io/okdp/images/okdp-gitops:${{ steps.vars.outputs.version }}
          build-args: |
            VERSION=${{ steps.vars.outputs.version }}
          labels: |
            org.opencontainers.image.title=okdp-gitops
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
