name: build-image

# Build the okdp-gitops image (the binary on Alpine, which a CI runner copies
# out or runs) and publish it to the OKDP registry on quay.io, tagged with
# the version given.

on:
  workflow_call:
    inputs:
      version:
        description: Version to tag the image with
        required: true
        type: string
    secrets:
      REGISTRY_USERNAME:
        required: true
      REGISTRY_ROBOT_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Version to tag the image with
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      # The gha build cache (cache-from/cache-to type=gha) uses the runner's
      # ACTIONS_RUNTIME_TOKEN, not GITHUB_TOKEN: no actions: write needed.
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # The version, through the environment, never in the script: SemVer
      # (a leading "v" dropped), the whole string, else the job fails, the
      # input not printed. A comma, a newline or a space would add tags
      # (docker/build-push-action splits tags on them) or an output of its
      # own.
      - id: vars
        env:
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          version="${INPUT_VERSION#v}"   # the image tag and the binary carry no leading "v"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::the version input is not MAJOR.MINOR.PATCH[-PRERELEASE] (SemVer, an optional leading v)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: quay.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_ROBOT_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: quay.io/okdp/images/okdp-gitops:${{ steps.vars.outputs.version }}
          build-args: |
            VERSION=${{ steps.vars.outputs.version }}
          labels: |
            org.opencontainers.image.title=okdp-gitops
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
