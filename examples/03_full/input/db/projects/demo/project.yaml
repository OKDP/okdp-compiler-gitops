# The project demo, the namespace demo: what it adds to the platform values
# for every instance of the project, the file of level 1, merged after
# platform.yaml, level 0, and before the instance's connections.yaml,
# level 2, and config.yaml.
#
# A level adds, it changes nothing a lower level sets: a key platform.yaml
# sets (global.okdp.ingress.suffix, global.imageRegistry), the same value
# included, or a connection it gives (platform-db, datalake), even by a field
# platform.yaml leaves out, fails the project (okdp-gitops refuses it
# as the tree loads); and global.okdp is the
# platform's: a project adds its classes to it (provisioning) and nothing
# else, a key platform.yaml leaves unset included:
#
#   global: {okdp: {ingress: {suffix: demo.example.org}}}
#   connections: {platform-db: {port: 5433}}
#   global: {okdp: {charts: {objects: {repository: oci://x, chart: okdp-objects, version: 0.1.0}}}}
#
#   examples/03_full/input/db/projects/demo/project.yaml: global.okdp.ingress.suffix is set at level 0, by examples/03_full/input/db/platform.yaml: a level adds values, it does not change a lower level's
#   examples/03_full/input/db/projects/demo/project.yaml: connections.platform-db is set at level 0, by examples/03_full/input/db/platform.yaml: a level adds values, it does not change a lower level's
#   examples/03_full/input/db/projects/demo/project.yaml: global.okdp.charts: a platform setting, of level 0 only (examples/03_full/input/db/platform.yaml): a project sets global.okdp.provisioning, nothing else of global.okdp

# The project's description: its own, a string, no value of its
# instances, which no instance receives (tree.ProjectDescription).
description: The analytics of the demo team
global:
  storageClass: fast-ssd               # every chart receives global
  # The project's own settings, beside okdp, the platform's: read by the
  # mapping (global.?project in okdp.yaml), which the compiler does not:
  # labels, node pool, ingress allowlist.
  project:
    name: demo
    costCenter: cc-4217
    nodePool: analytics
    allowedSourceRanges: [10.20.0.0/16, 192.168.10.0/24]
  okdp:
    # The project's classes of database connections, of which the
    # platform defines none, and their default, which the platform does not
    # set: the class of the claims that name neither a class nor a
    # provider, its provider an instance of the namespace, named by its
    # release here, demo-db, or its name, db. A project adds classes, and
    # changes none of the platform's.
    provisioning:
      database:
        default: standard
        classes:
          standard: {provider: demo-db}

# The project's named claims: each a connection of its own provider,
# declared once, provisioned whether an instance references it or not, and
# referenced by name as a connection is (catalogs[1].database: marketing);
# what it requests of its provider, checked against the contract's claim
# schema (x-okdp-claim): the database's size.
claims:
  marketing:
    contract: database
    request: {size: 20Gi}

# Connections every instance of the project may reference by name, beside
# the platform's.
connections:
  demo-warehouse:                      # MySQL: driver derived, no sslMode (a PostgreSQL default)
    contract: database
    engine: mysql
    host: warehouse.demo.example.org
    port: 3306
    dbName: sales
    secretRef: {name: demo-warehouse-credentials}
  demo-bucket:                         # MinIO: pathStyle defaults to true
    contract: s3
    provider: minio
    endpoint: https://minio.demo.example.org
    bucket: demo-sales
    secretRef: {name: demo-bucket-credentials}
