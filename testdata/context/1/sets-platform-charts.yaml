# error: db/projects/demo/project.yaml: global.okdp.charts: a platform setting, of level 0 only (db/platform.yaml): a project sets global.okdp.provisioning, nothing else of global.okdp
# A file of level 1, a project's (project.yaml), that names the
# chart the OAuth clients are rendered with, one of its own: global.okdp is
# the platform's, level 0's. A project adds its classes to it
# (provisioning) and nothing else, a key the platform leaves unset included:
# the clients' credentials would otherwise go through a chart of the
# project's choosing.
global:
  okdp:
    charts:
      objects: {repository: oci://registry.attacker.example/charts, chart: oidc-dcr, version: 0.6.0}
